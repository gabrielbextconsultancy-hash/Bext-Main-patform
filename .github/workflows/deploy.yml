name: Deploy to cPanel (bext.dev-environment.site)

# Build the dashboard standalone bundle in Actions, upload it through the
# cPanel file manager API, extract, and reload Passenger.
# Requires repo secret CPANEL_API_TOKEN (cPanel API token for user devenvir).

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency: { group: cpanel-deploy, cancel-in-progress: false }

env:
  APP_DIR: /home/devenvir/bext.dev-environment.site/bext-platform/dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build standalone bundle
        working-directory: dashboard
        run: |
          npm ci
          npx next build
          rm -rf .next/standalone/public .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf bext-deploy.tar.gz .next/standalone

      - name: Deploy via cPanel file API
        working-directory: dashboard
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://dev-environment.site:2083"
          AUTH="Authorization: cpanel devenvir:${CPANEL_TOKEN}"
          R="--resolve dev-environment.site:2083:185.2.168.30"
          A2="${BASE}/json-api/cpanel?cpanel_jsonapi_user=devenvir&cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop"
          curl -sS -k $R -H "$AUTH" -F "dir=${APP_DIR}" -F "overwrite=1" \
            -F "file-1=@bext-deploy.tar.gz" -F "file-2=@app.js" \
            "${BASE}/execute/Fileman/upload_files" | grep -q '"status":1'
          curl -sS -k $R -H "$AUTH" "${A2}&op=unlink&sourcefiles=${APP_DIR}/.next" > /dev/null || true
          curl -sS -k $R -H "$AUTH" "${A2}&op=extract&sourcefiles=${APP_DIR}/bext-deploy.tar.gz&destfiles=${APP_DIR}" | grep -q '"result":1'
          date > restart.txt
          curl -sS -k $R -H "$AUTH" -F "dir=${APP_DIR}/tmp" -F "overwrite=1" \
            -F "file-1=@restart.txt" "${BASE}/execute/Fileman/upload_files" > /dev/null

      - name: Verify live
        run: |
          # Hit https directly and follow redirects. The app forces HTTPS and the
          # root now redirects to /proposal, so a bare http request answers 301 —
          # which is correct behaviour, not a failed deploy.
          sleep 15
          for i in $(seq 1 8); do
            c=$(curl -sL -o /dev/null -w "%{http_code}" https://bext.dev-environment.site/ || true)
            echo "try $i: $c"
            [ "$c" = "200" ] && exit 0
            sleep 10
          done
          echo "site did not return 200 after 8 attempts"
          exit 1
