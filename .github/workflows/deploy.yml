name: Deploy to Hostinger VPS

# Everything runs on the Hostinger VPS: the dashboard, the read API, the
# headless fetcher, Postgres, Qdrant, Ollama and n8n. iFastNet only serves DNS
# for dev-environment.site, so there is nothing to upload to cPanel — this
# syncs the source to /docker/bext and rebuilds the affected containers.
#
# Requires repo secrets:
#   VPS_SSH_KEY  private half of the github-actions-bext-deploy ed25519 key
#   VPS_HOST     187.127.213.243

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'api/**'
      - 'fetcher/**'
      - 'infra/docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to rebuild (dashboard, api, fetcher, or all)'
        default: dashboard

concurrency: { group: vps-deploy, cancel-in-progress: false }

env:
  REMOTE: /docker/bext

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      # Build first. A compile error should fail here, in Actions, rather than
      # halfway through a rebuild on the box that is serving the client.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Typecheck and build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npx tsc --noEmit
          npx next build

      - name: Authorise SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Decide what changed so a fetcher-only commit does not rebuild the
      # dashboard (a three-minute Next build) for nothing.
      - name: Work out which services changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SVC="${{ github.event.inputs.service }}"
            [ "$SVC" = "all" ] && SVC="dashboard api fetcher"
          else
            SVC=""
            D=$(git diff --name-only HEAD~1 HEAD || echo dashboard/)
            echo "$D" | grep -q '^dashboard/' && SVC="$SVC dashboard"
            echo "$D" | grep -q '^api/'       && SVC="$SVC api"
            echo "$D" | grep -q '^fetcher/'   && SVC="$SVC fetcher"
            echo "$D" | grep -q '^infra/'     && SVC="dashboard api fetcher"
          fi
          SVC=$(echo $SVC | xargs)
          echo "services=$SVC" >> "$GITHUB_OUTPUT"
          echo "rebuilding: ${SVC:-nothing}"

      - name: Sync source to the VPS
        if: steps.changed.outputs.services != ''
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes"
          for s in ${{ steps.changed.outputs.services }}; do
            rsync -az --delete \
              --exclude node_modules --exclude .next --exclude '*.tar.gz' \
              --exclude tsconfig.tsbuildinfo \
              -e "$SSH" "$s/" "root@${{ secrets.VPS_HOST }}:${REMOTE}/$s/"
            echo "synced $s"
          done
          # The repo keeps compose under infra/ with ../service build paths;
          # the VPS layout is flat, so rewrite them on the way over.
          sed 's#build: \.\./#build: ./#' infra/docker-compose.yml > /tmp/compose.yml
          rsync -az -e "$SSH" /tmp/compose.yml \
            "root@${{ secrets.VPS_HOST }}:${REMOTE}/docker-compose.yml"

      - name: Rebuild and restart
        if: steps.changed.outputs.services != ''
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
            "root@${{ secrets.VPS_HOST }}" \
            "cd ${REMOTE} && docker compose -p bext up -d --build ${{ steps.changed.outputs.services }} && docker image prune -f >/dev/null"

      # Verified from the VPS, against the domain in its own .env, so the check
      # follows the real traefik route rather than a hardcoded hostname.
      - name: Verify the dashboard answers
        if: contains(steps.changed.outputs.services, 'dashboard')
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
            "root@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          DOMAIN=$(grep -E '^DASHBOARD_DOMAIN=' /docker/bext/.env | cut -d= -f2-)
          for i in $(seq 1 12); do
            c=$(curl -sL -o /dev/null -w '%{http_code}' "https://${DOMAIN}/" || true)
            echo "try $i: $c"
            [ "$c" = "200" ] && exit 0
            sleep 10
          done
          echo "https://${DOMAIN}/ never returned 200"
          docker logs --tail 40 bext-dashboard
          exit 1
          EOF
