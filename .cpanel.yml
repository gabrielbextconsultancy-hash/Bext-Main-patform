---
# cPanel Git Version Control deployment — runs on the server after every pull
# triggered by the GitHub Actions workflow (.github/workflows/deploy.yml).
#
# Repo checkout:  /home/devenvir/bext.dev-environment.site/bext-platform
# Node app root:  .../bext-platform/dashboard  (Node.js Selector, Node 22)
# App URL:        bext.dev-environment.site
deployment:
  tasks:
    - export APP=/home/devenvir/bext.dev-environment.site/bext-platform/dashboard
    - export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
    - cd $APP && npm ci
    - cd $APP && npx next build
    # Standalone bundle needs static assets alongside it.
    - cd $APP && /bin/rm -rf .next/standalone/public .next/standalone/.next/static
    - cd $APP && /bin/cp -R public .next/standalone/public
    - cd $APP && /bin/cp -R .next/static .next/standalone/.next/static
    # Passenger reload.
    - /bin/mkdir -p $APP/tmp && /bin/touch $APP/tmp/restart.txt
