# BEXT Consultancy stack — Hostinger VPS 1866850, deployed to /docker/bext
#
# Runs alongside the existing Premier Fitness `n8n` project on the same host.
# That project owns traefik and ports 80/443; this stack joins its network
# (`n8n_default`) so traefik can route to it, and publishes nothing itself
# except a loopback port for debugging.
#
#   docker compose -p bext up -d
#
# NEVER touch /docker/n8n — that is a different client.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bext-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: bext
    ports:
      # Loopback only. Local dev reaches this through an SSH tunnel.
      - "127.0.0.1:5432:5432"
    volumes:
      - bext_pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - bext_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d bext"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bext-qdrant
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      # Loopback only.
      - "127.0.0.1:6333:6333"
    volumes:
      - bext_qdrant:/qdrant/storage
    networks:
      - bext_internal

  fetcher:
    build: ../fetcher
    image: bext-fetcher:latest
    container_name: bext-fetcher
    restart: always
    environment:
      PORT: 8080
      # Chromium is memory-hungry; two at a time is what this VPS comfortably takes.
      MAX_CONCURRENT: 2
    # Chromium needs more than Docker's default 64 MB of shared memory or it
    # crashes partway through rendering.
    shm_size: 512mb
    networks:
      - bext_internal
    # Reached only as http://fetcher:8080 from n8n. Never published.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.6
    container_name: bext-n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only — public access is through traefik on 443.
      - "127.0.0.1:5679:5678"
    environment:
      # --- workflow metadata lives in Postgres, not SQLite ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${PG_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}

      # --- host / proxy ---
      N8N_HOST: ${N8N_SUBDOMAIN}.${DOMAIN_NAME}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_SUBDOMAIN}.${DOMAIN_NAME}/
      N8N_PROXY_HOPS: 1

      # --- runtime ---
      NODE_ENV: production
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}

      # Irreplaceable. Losing this makes every stored credential unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Read by the analysis workflow's Code node as $env.GEMINI_API_KEY.
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Code nodes may not require Node builtins unless named here. The ingest
      # parser hashes article content with crypto to deduplicate stories that are
      # syndicated across several sources under different URLs.
      # crypto hashes article content to deduplicate syndicated stories; url
      # provides the URL constructor, which the sandbox does not expose globally.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,url

      # The ingest Code node fetches 64 sources, 15 of them through a headless
      # browser. The 300s default is not enough even with the work parallelised.
      N8N_RUNNERS_TASK_TIMEOUT: 900

      # Trim executions so Postgres does not grow without bound — the ingest
      # workflow runs hourly and the analysis workflow every 30 minutes.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - bext_n8n:/home/node/.n8n
      - bext_files:/files
    networks:
      # bext_internal reaches postgres/qdrant; n8n_default lets the existing
      # traefik reach this container. Both are required.
      - bext_internal
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.bext-n8n.rule=Host(`${N8N_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.bext-n8n.entrypoints=web,websecure
      - traefik.http.routers.bext-n8n.tls=true
      - traefik.http.routers.bext-n8n.tls.certresolver=mytlschallenge
      - traefik.http.services.bext-n8n.loadbalancer.server.port=5678
      - traefik.http.middlewares.bext-n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.bext-n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.bext-n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.bext-n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.bext-n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.bext-n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.bext-n8n.headers.STSPreload=true
      - traefik.http.routers.bext-n8n.middlewares=bext-n8n@docker

  ollama:
    image: ollama/ollama:latest
    container_name: bext-ollama
    restart: always
    # Loopback only. n8n reaches it as http://ollama:11434 on the internal
    # network; 11434 on 127.0.0.1 is for benchmarking and manual pulls.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - bext_ollama:/root/.ollama
    environment:
      # Keep one model in memory permanently — otherwise the ~5 GB model reloads
      # on every call and every invocation waits 20+ seconds for cold start.
      OLLAMA_KEEP_ALIVE: 24h
      # Two concurrent generations would swap heavily on 8 GB RAM. One at a time
      # is honest capacity for this VPS.
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      # Give inference both vCPUs. Leaves everything else contending, which is
      # fine because Postgres and n8n are near-idle between workflow ticks.
      OLLAMA_NUM_THREADS: 2
    # Ceiling below the model size + a little headroom; Docker OOM-kills the
    # container rather than the whole host if a bigger model is accidentally
    # pulled. Adjust if you switch models.
    deploy:
      resources:
        limits:
          memory: 6g
    networks:
      - bext_internal

networks:
  bext_internal:
    driver: bridge
  n8n_default:
    external: true

volumes:
  bext_pgdata:
  bext_qdrant:
  bext_n8n:
  bext_files:
  bext_ollama:
