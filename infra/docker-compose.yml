# BEXT Consultancy stack — Hostinger VPS 1866850, deployed to /docker/bext
#
# Runs alongside the existing Premier Fitness `n8n` project on the same host.
# That project owns traefik and ports 80/443; this stack joins its network
# (`n8n_default`) so traefik can route to it, and publishes nothing itself
# except a loopback port for debugging.
#
#   docker compose -p bext up -d
#
# NEVER touch /docker/n8n — that is a different client.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bext-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: bext
    ports:
      # Loopback only. Local dev reaches this through an SSH tunnel.
      - "127.0.0.1:5432:5432"
    volumes:
      - bext_pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - bext_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d bext"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bext-qdrant
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      # Loopback only.
      - "127.0.0.1:6333:6333"
    volumes:
      - bext_qdrant:/qdrant/storage
    networks:
      - bext_internal

  fetcher:
    build: ../fetcher
    image: bext-fetcher:latest
    container_name: bext-fetcher
    restart: always
    environment:
      PORT: 8080
      # Chromium is memory-hungry; two at a time is what this VPS comfortably takes.
      MAX_CONCURRENT: 2
    # Chromium needs more than Docker's default 64 MB of shared memory or it
    # crashes partway through rendering.
    shm_size: 512mb
    ports:
      # Loopback only, like Postgres and Qdrant — never 0.0.0.0. n8n still reaches
      # it as http://fetcher:8080 over the internal network; this exists so the
      # build scripts can render documents through an SSH tunnel, which
      # docs/05-runbook.md describes and which could not work while the port was
      # unpublished.
      - "127.0.0.1:8080:8080"
    networks:
      - bext_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Retrieval for sources that refuse an ordinary HTTP client. Separate from the
  # Node fetcher because the capability is a TLS fingerprint that only curl_cffi
  # reproduces — not something more Chromium solves. See scrapling/app.py for the
  # before-and-after numbers that justified the extra service.
  scrapling:
    build: ../scrapling
    image: bext-scrapling:latest
    container_name: bext-scrapling
    restart: always
    environment:
      PORT: 8090
      FETCH_TIMEOUT: 45
      # Session cookies for subscriber-only sources, JSON, from .env. Never commit.
      SOURCE_COOKIES: ${SOURCE_COOKIES:-}
    ports:
      # Loopback only, as with Postgres and Qdrant. n8n reaches it in-network as
      # http://scrapling:8090; this publish exists so the repair harness can drive
      # it through an SSH tunnel.
      - "127.0.0.1:8090:8090"
    networks:
      - bext_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.6
    container_name: bext-n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only — public access is through traefik on 443.
      - "127.0.0.1:5679:5678"
    environment:
      # --- workflow metadata lives in Postgres, not SQLite ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${PG_USER}
      DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}

      # --- host / proxy ---
      N8N_HOST: ${N8N_SUBDOMAIN}.${DOMAIN_NAME}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_SUBDOMAIN}.${DOMAIN_NAME}/
      N8N_PROXY_HOPS: 1

      # --- runtime ---
      NODE_ENV: production
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}

      # Irreplaceable. Losing this makes every stored credential unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Read by the analysis workflow's Code node as $env.GEMINI_API_KEY.
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Read by the daily report's render node and the SMTP send node.
      REPORT_SENDER: ${REPORT_SENDER}
      REPORT_RECIPIENT: ${REPORT_RECIPIENT}

      # Microsoft Graph — client-credentials flow for the Brief B workflows
      # (health checks, meeting transcripts, SharePoint filing). Read as
      # $env.MS_* inside Code nodes, same arrangement as the Gemini key.
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_SENDER_UPN: ${MS_SENDER_UPN}

      # Graph publishes no application permission for posting a channel message,
      # so the meeting card goes through a Teams Workflows webhook the tenant
      # creates. Secret — the URL is its own bearer token.
      # See docs/TEAMS-WEBHOOK-SETUP.md.
      TEAMS_MEETING_WEBHOOK_URL: ${TEAMS_MEETING_WEBHOOK_URL}

      # Calendars the meeting workflow polls. Whoever hosts a meeting owns its
      # transcript, so this is not just the automation account.
      MEETING_HOSTS: ${MEETING_HOSTS}
      MEETING_REPORT_RECIPIENT: ${MEETING_REPORT_RECIPIENT}

      # Code nodes may not require Node builtins unless named here. The ingest
      # parser hashes article content with crypto to deduplicate stories that are
      # syndicated across several sources under different URLs.
      # crypto hashes article content to deduplicate syndicated stories; url
      # provides the URL constructor, which the sandbox does not expose globally.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,url,https,dns

      # Code nodes are denied $env by default, which silently killed the analysis
      # workflow on every tick: it loaded 40 articles then died reading
      # $env.GEMINI_API_KEY, so nothing was ever scored. Keys stay in the
      # environment rather than inline in workflow JSON, so this has to be open.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # The ingest Code node fetches 64 sources, 15 of them through a headless
      # browser. The 300s default is not enough even with the work parallelised.
      N8N_RUNNERS_TASK_TIMEOUT: 900

      # Trim executions so Postgres does not grow without bound — the ingest
      # workflow runs hourly and the analysis workflow every 30 minutes.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - bext_n8n:/home/node/.n8n
      - bext_files:/files
    networks:
      # bext_internal reaches postgres/qdrant; n8n_default lets the existing
      # traefik reach this container. Both are required.
      - bext_internal
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.bext-n8n.rule=Host(`${N8N_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.bext-n8n.entrypoints=web,websecure
      - traefik.http.routers.bext-n8n.tls=true
      - traefik.http.routers.bext-n8n.tls.certresolver=mytlschallenge
      - traefik.http.services.bext-n8n.loadbalancer.server.port=5678
      - traefik.http.middlewares.bext-n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.bext-n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.bext-n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.bext-n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.bext-n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.bext-n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.bext-n8n.headers.STSPreload=true
      - traefik.http.routers.bext-n8n.middlewares=bext-n8n@docker

  dashboard:
    build: ../dashboard
    image: bext-dashboard:latest
    container_name: bext-dashboard
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: https://${DASHBOARD_DOMAIN}
      # Direct connection on the internal network — no read API, no token, no
      # cross-host hop. That indirection only existed because the dashboard used
      # to run on cPanel, which blocks outbound connections.
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: bext
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      SESSION_SECRET: ${SESSION_SECRET}
      N8N_URL: https://${N8N_SUBDOMAIN}.${DOMAIN_NAME}
      QDRANT_URL: http://qdrant:6333
      # Connection-health probes only — Gemini reachability and GitHub repo/CI
      # status shown on /health. Analysis itself runs in the n8n container.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: gabrielbextconsultancy-hash/Bext-Main-patform
    networks:
      - bext_internal
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.bext-dash.rule=Host(`${DASHBOARD_DOMAIN}`)
      - traefik.http.routers.bext-dash.entrypoints=web,websecure
      - traefik.http.routers.bext-dash.tls=true
      - traefik.http.routers.bext-dash.tls.certresolver=mytlschallenge
      - traefik.http.services.bext-dash.loadbalancer.server.port=3000

  api:
    build: ../api
    image: bext-api:latest
    container_name: bext-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8090
      API_TOKEN: ${API_TOKEN}
      PG_HOST: postgres
      PG_DB: bext
      # Connects as the read-only role, so a leaked token still cannot write.
      PG_USER: bext_ro
      PG_PASSWORD: ${PG_RO_PASSWORD}
    networks:
      - bext_internal
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.bext-api.rule=Host(`${API_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.bext-api.entrypoints=web,websecure
      - traefik.http.routers.bext-api.tls=true
      - traefik.http.routers.bext-api.tls.certresolver=mytlschallenge
      - traefik.http.services.bext-api.loadbalancer.server.port=8090

  ollama:
    image: ollama/ollama:latest
    container_name: bext-ollama
    restart: always
    # Loopback only. n8n reaches it as http://ollama:11434 on the internal
    # network; 11434 on 127.0.0.1 is for benchmarking and manual pulls.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - bext_ollama:/root/.ollama
    environment:
      # Unload the model after a few minutes idle. Keeping it resident costs ~5 GB
      # on a 8 GB host that also runs two other clients' stacks — that starved the
      # box into swap and made SSH and both n8n instances unreachable. A batch of
      # calls pays one ~10 s cold start and then runs warm, which is the right
      # trade for scheduled work.
      OLLAMA_KEEP_ALIVE: 5m
      # Two concurrent generations would swap heavily on 8 GB RAM. One at a time
      # is honest capacity for this VPS.
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      # Give inference both vCPUs. Leaves everything else contending, which is
      # fine because Postgres and n8n are near-idle between workflow ticks.
      OLLAMA_NUM_THREADS: 2
    # Ceiling below the model size + a little headroom; Docker OOM-kills the
    # container rather than the whole host if a bigger model is accidentally
    # pulled. Adjust if you switch models.
    deploy:
      resources:
        limits:
          memory: 6g
    networks:
      - bext_internal

networks:
  bext_internal:
    driver: bridge
  n8n_default:
    external: true

volumes:
  bext_pgdata:
  bext_qdrant:
  bext_n8n:
  bext_files:
  bext_ollama:
