# BEXT — industry source registry
#
# Single source of truth for what the daily report monitors. Transcribed from
# Project Brief_Industry Daily Report_2026.07.28.pdf, including every URL embedded
# as a hyperlink in that document. The `sources` table is seeded from this file
# and never hand-edited.
#
# method:
#   rss     — feed discovered and verified to return a valid RSS/Atom document
#   scrape  — no feed; the article index is parsed from HTML
#
# requires_browser: true means a plain HTTP GET is refused (403/401) and the fetch
# has to go through a real browser session.
#
# Generated 68 sources: 37 RSS, 31 scrape.

# Sections deferred by the brief to a separate report.
deferred_sections:
  - name: Grants / Funding Updates
    note: "Brief says: link to other report (later deliverable)."
  - name: LinkedIn Industry Behaviour and News
    note: "Brief says: link to other report."

# Filter vocabularies the brief spells out.
register_categories:
  - Authorisations
  - Network Exemptions
  - Retail Exemptions
  - Guidelines Schemes Models and Reviews
  - Projects
  - Decisions
  - Determination and Access Arrangements
conversation_categories:
  - "Environment & Energy"
  - "Energy & Transport"
  - "Climate Change & Weather"
  - Pollution and Human Impact
  - Sustainable Cities
reneweconomy_sections:
  - Latest
  - Energy Bytes
  - More News
  - Renewables
  - Storage
  - Commentary
  - "Policy & Planning"
  - Most Read
  - Chart of the Day

