<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BEXT Consultancy — Business Structure Efficiency — Draft Plan</title>
<style>
  :root{
    --bg:#0a0d12; --p1:#11151c; --p2:#161b24; --p3:#1c222c; --ln:#1e2632;
    --ink:#e3e8ef; --dim:#8d99ab; --faint:#5d6a7d;
    --a:#14b8a6; --b:#a78bfa; --warn:#fbbf24; --ok:#34d399; --bad:#fb7185;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 24px 40px}
  h1{font-size:20px;margin:4px 0 0;font-weight:600;letter-spacing:-.01em}
  h2{font-size:24px;margin:8px 0 0;font-weight:600;letter-spacing:-.01em;line-height:1.15}
  h3{font-size:13px;margin:0 0 8px;font-weight:600}
  .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
  .k2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .lede{margin:8px 0 0;color:var(--dim);font-size:15px;max-width:62ch}
  header.top{border-bottom:1px solid var(--ln);padding-bottom:20px;margin-bottom:24px}
  footer.foot{margin-top:32px;border-top:1px solid var(--ln);padding-top:20px;font-size:11px;color:var(--faint)}

  /* section nav */
  .secnav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--ln);padding-bottom:12px;margin-bottom:12px}
  .secnav button{background:transparent;border:0;color:var(--dim);font:inherit;font-size:12px;
    padding:5px 10px;border-radius:8px;cursor:pointer}
  .secnav button:hover{background:var(--p2);color:var(--ink)}
  .secnav button.on{background:color-mix(in srgb,var(--b) 15%,transparent);color:var(--b);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--b) 30%,transparent)}

  /* slide card */
  .slide{position:relative;min-height:560px;padding:36px 40px;border:1px solid var(--ln);
    border-radius:16px;background:linear-gradient(160deg,var(--p1) 0%,#0d1117 100%);
    display:flex;flex-direction:column}
  .slide .num{position:absolute;right:22px;bottom:14px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .slide .body{margin-top:24px;flex:1;font-size:14px}

  /* controls */
  .ctl{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .btn{background:var(--p2);border:1px solid var(--p3);color:var(--ink);
    border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){border-color:#3d4756}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.sm{font-size:12px;color:var(--dim)}
  .ctl .pos{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .dots{display:flex;gap:4px;flex:1;min-width:0}
  .dots i{flex:1;min-width:0;height:3px;border-radius:2px;background:var(--p3);cursor:pointer;transition:.15s}
  .dots i:hover{background:#3d4756}
  .dots i.on{background:var(--b)}

  /* helpers */
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  @media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:color-mix(in srgb,var(--p2) 60%,transparent);border:1px solid var(--ln);
    border-radius:12px;padding:16px 18px;color:var(--dim);font-size:13px;line-height:1.55}
  .card h3{color:var(--ink)}
  .card.a{border-left:2px solid var(--a)}
  .card.b{border-left:2px solid var(--b)}
  .card.c{border-left:2px solid var(--warn)}
  .num-big{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1;margin:0}
  .num-big.a{color:var(--a)} .num-big.b{color:var(--b)} .num-big.c{color:var(--warn)}

  /* tag */
  .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;
    border:1px solid var(--p3);background:var(--p3);color:var(--dim);white-space:nowrap}
  .tag.a{color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent);border-color:color-mix(in srgb,var(--a) 40%,transparent)}
  .tag.b{color:var(--b);background:color-mix(in srgb,var(--b) 10%,transparent);border-color:color-mix(in srgb,var(--b) 40%,transparent)}
  .tag.c{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--ln)}
  td{padding:9px 12px 9px 0;border-bottom:1px solid color-mix(in srgb,var(--ln) 50%,transparent);
    vertical-align:top;color:var(--ink)}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}

  /* step / flow */
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
  .step{flex:1 1 0;min-width:130px;background:color-mix(in srgb,var(--p2) 60%,transparent);
    border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
  .step .n{font-size:9.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
  .step .t{margin-top:2px;font-size:12.5px;line-height:1.35;color:#d3d9e4}
  .who{margin-top:8px;display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px}
  .who.ai{background:color-mix(in srgb,var(--b) 15%,transparent);color:var(--b)}
  .who.you{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .who.sys{background:color-mix(in srgb,var(--a) 15%,transparent);color:var(--a)}

  ul{margin:0;padding-left:18px} li{margin:4px 0}
  code,pre{font:12px/1.55 ui-monospace,"Cascadia Code",Menlo,monospace}
  pre{margin:0;color:var(--dim);white-space:pre-wrap}
  em{color:#d3d9e4;font-style:italic}
  strong{color:var(--ink)}
  a{color:var(--b)}

  /* fullscreen */
  body.fs .wrap{max-width:none;padding:20px 24px}
  body.fs .slide{min-height:calc(100vh - 200px)}

  /* print */
  @page{size:1280px 720px;margin:0}
  @media print{
    body{background:#fff}
    .secnav,.ctl,footer.foot,header.top{display:none !important}
    .wrap{padding:0}
    .slide{width:1280px;height:720px;min-height:720px;border:0;border-radius:0;
      page-break-after:always;break-after:page;margin:0;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .slide:last-child{page-break-after:auto}
    /* print shows every slide */
    .slide{display:flex !important}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <p class="kicker">BEXT Consultancy</p>
  <h1>Business Structure Efficiency</h1>
</header>

<div class="secnav" id="secnav"></div>

<div id="stage"></div>

<div class="ctl">
  <button class="btn" id="prev">← Prev</button>
  <button class="btn" id="next">Next →</button>
  <span class="pos" id="pos">1 / 17</span>
  <div class="dots" id="dots"></div>
  <button class="btn sm" id="full">Full screen</button>
  <button class="btn sm" id="print" title="Print / save as PDF">Print</button>
</div>

<footer class="foot">
  Prepared by BEXT Consultancy · Draft Plan, 11 August 2026 · responds to the project brief dated 28 July 2026.
</footer>
</div>

<template id="slides">

<!-- 1 -->
<section data-section="Overview" data-kicker="BEXT Consultancy · Draft Plan · 11 August 2026" data-title="Business Structure Efficiency" data-lede="A digital operating model where information is captured once, flows between systems on its own, and AI does the drafting — leaving review and approval as the only manual steps.">
  <div style="display:flex;flex-direction:column;height:100%;justify-content:flex-end">
    <div class="grid g3">
      <div class="card a"><p class="num-big a">11</p><p style="margin:8px 0 0">platforms already in use — the plan adds almost nothing</p></div>
      <div class="card b"><p class="num-big b">9</p><p style="margin:8px 0 0">review areas answered, meeting workflow first</p></div>
      <div class="card c"><p class="num-big c">8 Sep</p><p style="margin:8px 0 0">final delivery · schematic architecture 25 Aug</p></div>
    </div>
    <p style="margin:20px 0 0;font-size:11px;color:var(--faint)">Responds to <em>Project Brief — Business Structure Efficiency</em>, 28 July 2026.</p>
  </div>
</section>

<!-- 2 -->
<section data-section="Overview" data-kicker="The ask" data-title="What the brief asks for" data-lede="Maximise time spent consulting. Minimise administration.">
  <div class="grid g2">
    <div class="card"><h3>Stated outcomes</h3>
      <ul>
        <li>Single point of data entry wherever possible</li>
        <li>Minimal duplication across systems</li>
        <li>Maximum use of AI for administrative tasks</li>
        <li>Highly automated document creation</li>
        <li>Automated meeting documentation and project administration</li>
        <li>Automated filing and organisation</li>
        <li>High-quality draft emails and reports needing only review</li>
        <li>Consistent processes, scalable, secure</li>
      </ul>
    </div>
    <div class="card c"><h3>The binding constraint</h3>
      <p style="margin:0" class="tnum"><em>“Confined to the shared capability of the following tools without need for third-party management platform.”</em></p>
      <p>This is the most important line in the brief. It rules out Monday, Notion, Asana, Zapier and every other SaaS layer. The design therefore uses <strong>what is already licensed</strong>, joined by automation you own and can hand over.</p>
      <p style="color:var(--faint)">Section 9 still asks for software recommendations — answered, but deliberately short.</p>
    </div>
  </div>
</section>

<!-- 3 -->
<section data-section="Current state" data-kicker="Current state · deliverable 1" data-title="Eleven platforms, no connective tissue" data-lede="Every platform is capable. None of them talk to each other, so the consultant is the integration layer.">
  <div class="scroll"><table>
    <thead><tr><th style="width:22%">Platform</th><th style="width:22%">Role today</th><th style="width:38%">Where the effort goes</th><th style="width:18%">Verdict</th></tr></thead>
    <tbody>
      <tr><td>Microsoft 365 — Outlook, Teams, SharePoint, OneDrive, Office, Copilot</td><td>Email, meetings, files, documents</td><td>Notes typed by hand, files named and filed by hand, actions tracked in memory</td><td><span class="tag a">Backbone</span></td></tr>
      <tr><td>HubSpot</td><td>CRM, pipeline</td><td>Contacts and deal stages re-entered from email threads</td><td><span class="tag a">Source of truth</span></td></tr>
      <tr><td>ProjectManager</td><td>Projects, tasks</td><td>Tasks retyped from meeting outcomes</td><td><span class="tag a">Source of truth</span></td></tr>
      <tr><td>Xero</td><td>Invoicing, accounts</td><td>Invoice triggers watched manually against milestones</td><td><span class="tag a">Source of truth</span></td></tr>
      <tr><td>Canva</td><td>Proposals, reports, presentations</td><td>Rebuilt from scratch each time; content re-keyed</td><td><span class="tag c">Template gap</span></td></tr>
      <tr><td>Claude / Copilot</td><td>Drafting assistance</td><td>Context pasted by hand every session; nothing is remembered</td><td><span class="tag c">Under-used</span></td></tr>
      <tr><td>WordPress · LinkedIn</td><td>Website, market presence</td><td>Content written ad hoc, publishing irregular</td><td><span class="tag c">Manual</span></td></tr>
      <tr><td>Adobe PDF · Chrome</td><td>Documents, browsing</td><td>Fine as-is</td><td><span class="tag">No change</span></td></tr>
    </tbody>
  </table></div>
</section>

<!-- 4 -->
<section data-section="Current state" data-kicker="Diagnosis" data-title="The same fact gets entered four times">
  <div class="grid g2">
    <div>
      <p style="color:var(--dim);margin:0 0 10px">One client conversation currently produces manual work in five places, because nothing carries information forward:</p>
      <div class="flow" style="flex-direction:column">
        <div class="step"><div class="n">Meeting</div><div class="t">Discussion happens</div><span class="who you">you</span></div>
        <div class="step"><div class="n">HubSpot</div><div class="t">Contact and stage updated — re-entered</div><span class="who you">you</span></div>
        <div class="step"><div class="n">ProjectManager</div><div class="t">Actions become tasks — re-entered</div><span class="who you">you</span></div>
        <div class="step"><div class="n">Outlook</div><div class="t">Follow-up written from scratch</div><span class="who you">you</span></div>
        <div class="step"><div class="n">SharePoint</div><div class="t">Documents named and moved by hand</div><span class="who you">you</span></div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card b"><h3>The principle</h3>
        Capture once. Distribute automatically. Review at the end, not throughout.
        <p>The meeting already produces a recording and a transcript. Everything on the left can be derived from it — which is why the brief names the meeting workflow as the top priority, and why we start there.</p>
      </div>
      <div class="card c"><h3>What this is not</h3>
        Not autonomous sending. Every outbound artefact — email, proposal, invoice trigger — stops at a draft for approval. The brief asks for “review, refinement and final approval”, and that gate stays everywhere the system touches a client.
      </div>
    </div>
  </div>
</section>

<!-- 5 -->
<section data-section="Future state" data-kicker="Future state · deliverable 2" data-title="Business Systems Integration Diagram" data-lede="Which system owns which fact, and how information moves.">
  <div class="grid" style="gap:14px">
    ${LANE:Capture|Teams|Meeting + transcript|sys;Outlook|Email + enquiries|sys;Forms|Structured intake|sys}
    ${LANE:Automation layer — n8n, owned by you|Route|Graph API listens, classifies, dispatches|ai;Draft|Minutes, emails, reports, posts|ai;Recall|Vector search over past work|ai}
    ${LANE:Systems of record|HubSpot|Clients, contacts, pipeline|sys;ProjectManager|Projects, tasks, actions|sys;SharePoint|Documents, knowledge|sys;Xero|Invoices, finance|sys}
    ${LANE:Output|Outlook|Drafts awaiting approval|you;Canva · Office|Proposals, reports, decks|you;WordPress · LinkedIn|Published content|you;Power BI|Business dashboard|sys}
  </div>
  <p style="margin-top:14px;font-size:11px;color:var(--faint)">n8n is self-hosted on infrastructure you own — it is the integration layer, not a third-party management platform, which is what keeps the design inside the constraint.</p>
</section>

<!-- 6 -->
<section data-section="Future state" data-kicker="Future state · operating model" data-title="One owner per fact" data-lede="Duplication ends when every type of information has exactly one home and everything else reads from it.">
  <div class="scroll"><table>
    <thead><tr><th style="width:20%">Information</th><th style="width:22%">Source of truth</th><th style="width:34%">Flows to</th><th style="width:24%">Entered where</th></tr></thead>
    <tbody>
      <tr><td>Clients &amp; contacts</td><td><span class="tag a">HubSpot</span></td><td>ProjectManager, Xero, document metadata</td><td>Once, at onboarding form</td></tr>
      <tr><td>Projects &amp; actions</td><td><span class="tag a">ProjectManager</span></td><td>Minutes, status emails, Power BI</td><td>Derived from meetings — not typed</td></tr>
      <tr><td>Documents &amp; deliverables</td><td><span class="tag a">SharePoint</span></td><td>Knowledge base, Canva, proposals</td><td>Filed automatically on creation</td></tr>
      <tr><td>Finance</td><td><span class="tag a">Xero</span></td><td>Power BI, project profitability</td><td>Triggered by project milestones</td></tr>
      <tr><td>Meetings &amp; decisions</td><td><span class="tag a">Teams + SharePoint</span></td><td>Minutes, actions, follow-up, knowledge base</td><td>Recording only</td></tr>
      <tr><td>Past work &amp; methodology</td><td><span class="tag a">Knowledge base</span></td><td>Every AI draft, every proposal</td><td>Indexed automatically</td></tr>
      <tr><td>Market presence</td><td><span class="tag a">WordPress</span></td><td>LinkedIn, capability statements</td><td>Drafted by AI, approved by you</td></tr>
    </tbody>
  </table></div>
</section>

<!-- 7 -->
<section data-section="Review areas" data-kicker="Review area 3 · stated highest priority" data-title="The meeting workflow" data-lede="“No manual note taking should be required.” One recording produces the minutes, the decisions, the tasks, the follow-up and the filing.">
  <div class="flow" style="margin-bottom:14px">
    <div class="step"><div class="n">01</div><div class="t">Record in Teams</div><span class="who sys">system</span></div>
    <div class="step"><div class="n">02</div><div class="t">Transcript produced</div><span class="who sys">system</span></div>
    <div class="step"><div class="n">03</div><div class="t">Minutes in your template</div><span class="who ai">AI</span></div>
    <div class="step"><div class="n">04</div><div class="t">Decisions extracted</div><span class="who ai">AI</span></div>
    <div class="step"><div class="n">05</div><div class="t">Actions to ProjectManager</div><span class="who ai">AI</span></div>
    <div class="step"><div class="n">06</div><div class="t">Follow-up email drafted</div><span class="who ai">AI</span></div>
    <div class="step"><div class="n">07</div><div class="t">Filed to SharePoint</div><span class="who ai">AI</span></div>
    <div class="step"><div class="n">08</div><div class="t">Review &amp; send</div><span class="who you">you</span></div>
  </div>
  <div class="grid g3">
    <div class="card a"><h3>How it is built</h3>Graph subscribes to meeting-transcript events. n8n pulls the transcript, runs it through the drafting prompt with your minutes template, then writes to ProjectManager, SharePoint and an Outlook draft.</div>
    <div class="card b"><h3>Extends to daily notes</h3>The brief asks that this cover personal brainstorming too. Same pipeline, different template — a voice note or OneNote page in, structured and filed output back.</div>
    <div class="card c"><h3>Open question</h3>Teams transcription must be enabled tenant-wide, and app-only transcript access needs an application access policy. Confirm licensing before 25 August — the one place the plan depends on a setting outside our control.</div>
  </div>
</section>

<!-- 8 -->
<section data-section="Review areas" data-kicker="Review areas 4 &amp; 5" data-title="Email and documents">
  <div class="grid g2">
    <div>
      <h3 style="font-size:15px;margin:0 0 10px">Email automation</h3>
      <div class="scroll"><table>
        <thead><tr><th style="width:52%">Case</th><th>AI produces</th></tr></thead>
        <tbody>
          <tr><td>New client enquiry</td><td>Classified, drafted reply, HubSpot contact created</td></tr>
          <tr><td>Meeting follow-up</td><td>Draft with decisions and actions attached</td></tr>
          <tr><td>Project progress update</td><td>Draft with status graphic and report attached</td></tr>
          <tr><td>Proposal response</td><td>Draft built from the closest past proposal</td></tr>
          <tr><td>Standard enquiry</td><td>Draft from the response library</td></tr>
          <tr><td>Reminders</td><td>Scheduled from ProjectManager due dates</td></tr>
          <tr><td>Commercial email filing</td><td>Prompt to file, then filed on confirmation</td></tr>
        </tbody>
      </table></div>
      <p style="margin-top:10px;font-size:11px;color:var(--faint)">Everything lands in Outlook <strong>Drafts</strong>. Nothing sends itself.</p>
    </div>
    <div>
      <h3 style="font-size:15px;margin:0 0 10px">Document management</h3>
      <div class="card"><p style="margin:0 0 8px">Proposed SharePoint structure — predictable enough that filing can be automatic:</p>
        <pre>/Clients
   /{Client}
      /{ProjectNo}-{ProjectName}
         /01-Proposals
         /02-Meetings
         /03-Deliverables
         /04-Correspondence
         /05-Finance
/Business
   /Capability Statements
   /Templates /Methodologies
   /Lessons Learned</pre>
      </div>
      <p style="margin-top:12px;color:var(--dim);font-size:13px"><strong>Naming:</strong> <code style="color:var(--a)">{YYYY-MM-DD}_{ProjectNo}_{DocType}_{Rev}</code> — applied by the automation, so it is consistent by construction rather than by discipline.</p>
    </div>
  </div>
</section>

<!-- 9 -->
<section data-section="Review areas" data-kicker="Review areas 7 &amp; 2" data-title="Knowledge management — where AI stops being an assistant" data-lede="“The objective is to avoid recreating work already completed.” This is the difference between AI that drafts generically and AI that drafts like you.">
  <div class="grid g2">
    <div class="flow" style="flex-direction:column">
      <div class="step"><div class="n">Index</div><div class="t">Every past proposal, report, masterplan, capability statement, presentation, meeting note, template and lesson learned</div><span class="who sys">system</span></div>
      <div class="step"><div class="n">Embed</div><div class="t">Chunked and vectorised into the knowledge base</div><span class="who sys">system</span></div>
      <div class="step"><div class="n">Retrieve</div><div class="t">Every draft starts by finding what you already wrote on the subject</div><span class="who ai">AI</span></div>
    </div>
    <div>
      <h3 style="font-size:15px;margin:0 0 10px">AI as worker, not assistant</h3>
      <div class="scroll"><table>
        <thead><tr><th style="width:46%">Task</th><th>Today → Proposed</th></tr></thead>
        <tbody>
          <tr><td>Meeting minutes</td><td>Manual → <span style="color:var(--b)">AI, you approve</span></td></tr>
          <tr><td>Action extraction</td><td>Manual → <span style="color:var(--b)">AI, you approve</span></td></tr>
          <tr><td>Email drafting</td><td>Manual → <span style="color:var(--b)">AI, you approve</span></td></tr>
          <tr><td>Proposals &amp; briefs</td><td>Manual → <span style="color:var(--b)">AI from past work</span></td></tr>
          <tr><td>Reports</td><td>Manual → <span style="color:var(--b)">AI first draft</span></td></tr>
          <tr><td>Presentations</td><td>Manual → <span style="color:var(--b)">AI into Canva template</span></td></tr>
          <tr><td>Filing &amp; naming</td><td>Manual → <span style="color:var(--a)">fully automatic</span></td></tr>
          <tr><td>Final judgement</td><td>You → <span style="color:var(--warn)">still you</span></td></tr>
        </tbody>
      </table></div>
    </div>
  </div>
</section>

<!-- 10 -->
<section data-section="Review areas" data-kicker="Review areas 6 &amp; 8" data-title="Marketing and structured capture">
  <div class="grid g2">
    <div class="grid">
      <div class="card a"><h3>Enquiry handling</h3>Inbound enquiry classified, response drafted, HubSpot contact created, follow-up scheduled.</div>
      <div class="card c"><h3>LinkedIn industry monitoring</h3>Summarising the energy industry’s LinkedIn activity into a periodic digest.

<script>
  // Build lane HTML for slide 5 out of a mini DSL — avoids repeating <div class="step"> boilerplate
  function laneHtml(spec){
    const [name, ...steps] = spec.split('|');
    // steps came in pairs of 3 originally; re-parse from the whole segment
    const parts = spec.split(';');
    const laneName = parts[0].split('|')[0];
    // rest each: label|text|who
    const stepHtml = parts.map((seg,i)=>{
      const cols = seg.split('|');
      const off = i===0 ? 1 : 0;   // first segment's first field is the lane name
      const [l,t,w] = [cols[off],cols[off+1],cols[off+2]];
      return `<div class="step"><div class="n">${l}</div><div class="t">${t}</div><span class="who ${w}">${w==='ai'?'AI':w==='sys'?'system':'you'}</span></div>`;
    }).join('');
    return `<div style="display:grid;grid-template-columns:160px 1fr;gap:12px">
      <p style="margin:8px 0 0;font-size:11px;color:var(--dim);line-height:1.35">${laneName}</p>
      <div class="flow">${stepHtml}</div>
    </div>`;
  }

  const tpl = document.getElementById('slides');
  const raw = tpl.innerHTML;
  // Substitute ${LANE:...} tokens before parsing
  const expanded = raw.replace(/\$\{LANE:([^}]+)\}/g, (_,s)=>laneHtml(s));
  const holder = document.createElement('div');
  holder.innerHTML = expanded;
  const sections = [...holder.querySelectorAll('section')];

  const secNames = [];
  sections.forEach(s=>{ const n=s.dataset.section; if(!secNames.includes(n)) secNames.push(n); });

  const stage = document.getElementById('stage');
  const secnavEl = document.getElementById('secnav');
  const dotsEl = document.getElementById('dots');
  const posEl = document.getElementById('pos');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const fullBtn = document.getElementById('full');
  const printBtn = document.getElementById('print');

  // section header
  secNames.forEach(n=>{
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = ()=>go(sections.findIndex(s=>s.dataset.section===n));
    secnavEl.appendChild(b);
  });

  // dots
  sections.forEach((s,i)=>{
    const d = document.createElement('i');
    d.title = `${i+1}. ${s.dataset.title}`;
    d.onclick = ()=>go(i);
    dotsEl.appendChild(d);
  });

  let cur = 0;
  function render(){
    const s = sections[cur];
    stage.innerHTML = `
      <article class="slide">
        <p class="kicker">${s.dataset.kicker}</p>
        <h2>${s.dataset.title}</h2>
        ${s.dataset.lede ? `<p class="lede">${s.dataset.lede}</p>` : ''}
        <div class="body">${s.innerHTML}</div>
        <span class="num">${String(cur+1).padStart(2,'0')}</span>
      </article>
    `;
    posEl.textContent = `${cur+1} / ${sections.length}`;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === sections.length-1;
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on', i===cur));
    [...secnavEl.children].forEach(b=>b.classList.toggle('on', b.textContent===s.dataset.section));
  }
  function go(n){ cur = Math.max(0, Math.min(sections.length-1, n)); render(); }

  prevBtn.onclick = ()=>go(cur-1);
  nextBtn.onclick = ()=>go(cur+1);
  fullBtn.onclick = ()=>{
    if (!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); document.body.classList.add('fs'); }
    else { document.exitFullscreen?.(); document.body.classList.remove('fs'); }
  };
  document.addEventListener('fullscreenchange', ()=>document.body.classList.toggle('fs', !!document.fullscreenElement));
  printBtn.onclick = ()=>{
    // Render every slide off-DOM for print; restore on afterprint
    const orig = stage.innerHTML;
    stage.innerHTML = sections.map((s,i)=>`
      <article class="slide">
        <p class="kicker">${s.dataset.kicker}</p>
        <h2>${s.dataset.title}</h2>
        ${s.dataset.lede ? `<p class="lede">${s.dataset.lede}</p>` : ''}
        <div class="body">${s.innerHTML}</div>
        <span class="num">${String(i+1).padStart(2,'0')}</span>
      </article>
    `).join('');
    const restore = ()=>{ stage.innerHTML = orig; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    setTimeout(()=>window.print(), 50);
  };

  addEventListener('keydown', e=>{
    if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); }
    else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
    else if (e.key==='Home') go(0);
    else if (e.key==='End') go(sections.length-1);
    else if (e.key.toLowerCase()==='f') fullBtn.click();
  });

  render();
</script>
